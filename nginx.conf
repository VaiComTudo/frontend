server {
    listen 80;
    
    # 1. Serve the React Frontend (Static Files)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 2. Proxy API requests to the Backend Container
    # Matches any URL starting with /api/
    location /api/ {
        # 'backend' is the service name from docker-compose.yml
        # The trailing slash '/' at the end is CRITICAL. 
        # It tells Nginx to strip '/api/' before sending to the backend.
        # Example: frontend requests '/api/login' -> backend receives '/login'
        proxy_pass http://localhost:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
